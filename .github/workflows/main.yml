name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FFExternal TIPA
    runs-on: ubuntu-24.04

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            clang \
            make \
            perl \
            unzip \
            zip \
            python3 \
            curl \
            wget \
            libplist-utils

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Bootstrap Theos
        run: |
          cd "$THEOS"
          ./bin/bootstrap

      - name: Check Theos
        run: |
          echo "THEOS=$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -x "$THEOS/bin/bootstrap"
          echo "Theos OK"

      - name: Check project
        run: |
          echo "=== Project files ==="
          find . -maxdepth 2 -type f | sort

          echo "=== Makefile ==="
          test -f makefile || test -f Makefile

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Find TIPA
        run: |
          echo "=== Output ==="
          find . -type f \
            \( -name "*.tipa" -o -name "*.ipa" -o -name "*.deb" \) \
            -print

          test -f packages/FFExternal.tipa

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-TIPA
          path: packages/FFExternal.tipa
          if-no-files-found: error
