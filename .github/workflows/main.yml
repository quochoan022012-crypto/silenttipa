
name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FFExternal TIPA
    runs-on: ubuntu-24.04

    env:
      THEOS: ${{ github.workspace }}/theos
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install basic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            sudo \
            git

      - name: Install Theos
        run: |
          rm -rf "$THEOS"

          export THEOS="${{ github.workspace }}/theos"

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"

          test -d "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          echo "=============================="
          echo "Theos installation OK"
          echo "=============================="

          "$THEOS/toolchain/linux/iphone/bin/clang" --version || true

      - name: Check project
        run: |
          echo "=============================="
          echo "Project files"
          echo "=============================="

          find . -maxdepth 2 -type f | sort

          echo "=============================="
          echo "Makefile"
          echo "=============================="

          test -f makefile || test -f Makefile

      - name: Build TIPA
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Check TIPA
        run: |
          echo "=============================="
          echo "Build output"
          echo "=============================="

          find . -type f \
            \( -name "*.tipa" -o -name "*.ipa" -o -name "*.deb" \) \
            -print

          test -f packages/FFExternal.tipa

          echo "=============================="
          echo "TIPA BUILD SUCCESS"
          echo "=============================="

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: FFExternal-TIPA
          path: packages/FFExternal.tipa
          if-no-files-found: error
